{% extends 'productos/base.html' %}

{% block content %}
<h2>Crear producto en matriz y sucursales</h2>

<form method="post" action="{% url 'productos:producto-crear-en-sucursales' %}">

    {% csrf_token %}
    <label>Nombre:</label><br>
    <input type="text" name="nombre" required><br><br>

    <label>Descripción:</label><br>
    <textarea name="descripcion" required></textarea><br><br>

    <label>Categoría:</label><br>
    <input type="text" name="categoria" required><br><br>

    <label>Precio base (matriz):</label><br>
    <input type="number" step="0.01" name="precio_matriz" required><br><br>

    <h4>Precios por sucursal</h4>

    <label>Precio sucursal 1 (localhost:50051):</label><br>
    <input type="number" step="0.01" name="precios[localhost:50051]" required><br><br>

    <label>Precio sucursal 2 (localhost:50053):</label><br>
    <input type="number" step="0.01" name="precios[localhost:50053]" required><br><br>

    <label>Precio sucursal 3 (localhost:50054):</label><br>
    <input type="number" step="0.01" name="precios[localhost:50054]" required><br><br>

    <button type="submit">Crear Producto</button>
</form>
{% endblock %}
