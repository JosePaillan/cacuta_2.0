<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestión de Stock{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1050;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'productos:lista_productos' %}">
                <i class="fas fa-box-open me-2"></i>Gestión de Stock
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'productos:lista_productos' %}">
                            <i class="fas fa-home me-1"></i>Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'productos:carrito' %}">
                            <i class="fas fa-shopping-cart me-1"></i>Carrito
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'productos:crear_producto' %}">
                            <i class="fas fa-shopping-cart me-1"></i>Crear Producto
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button id="alertasBtn" class="btn btn-outline-light btn-sm position-relative">
                            <i class="fas fa-exclamation-triangle me-1"></i>Alertas
                            <span id="alertasBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                                0
                            </span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Panel de Alertas de Stock -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
        <div id="alertasPanel" class="card shadow" style="width: 400px; max-height: 500px; overflow-y: auto; display: none;">
            <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                <h6 class="mb-0">
                    <i class="fas fa-exclamation-triangle me-2"></i>Alertas de Stock
                </h6>
                <button type="button" class="btn-close" onclick="toggleAlertasPanel()"></button>
            </div>
            <div class="card-body p-0">
                <div id="alertasLista" class="list-group list-group-flush">
                    <!-- Las alertas se cargarán aquí dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast para notificaciones -->
    <div class="toast-container">
        <!-- Las notificaciones se crearán dinámicamente aquí -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Función para obtener el token CSRF
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Función para mostrar notificaciones
        function showNotification(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type} border-0`;
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'assertive');
            toast.setAttribute('aria-atomic', 'true');
            
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            const container = document.querySelector('.toast-container');
            container.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
            
            toast.addEventListener('hidden.bs.toast', () => {
                container.removeChild(toast);
            });
        }

        // --- SSE para alertas de stock ---
        window.alertas = window.alertas || [];
        let alertasPanelVisible = false;

        function renderAlertas() {
            const lista = document.getElementById('alertasLista');
            lista.innerHTML = '';
            if (window.alertas.length === 0) {
                lista.innerHTML = '<div class="list-group-item text-center text-muted">No hay alertas activas</div>';
            } else {
                window.alertas.forEach(alerta => {
                    const item = document.createElement('div');
                    item.className = 'list-group-item d-flex justify-content-between align-items-center';
                    item.innerHTML = `
                        <div>
                            <strong>${alerta.producto}</strong><br>
                            <span class="badge bg-warning text-dark">${alerta.sucursal}</span>
                            <span class="ms-2">Stock: <strong>${alerta.stock_actual}</strong> (Umbral: ${alerta.umbral})</span><br>
                            <small class="text-muted">${alerta.mensaje}</small>
                        </div>
                        <span class="badge bg-danger">${alerta.tipo}</span>
                    `;
                    lista.appendChild(item);
                });
            }
            // Actualizar badge
            const badge = document.getElementById('alertasBadge');
            if (window.alertas.length > 0) {
                badge.textContent = window.alertas.length;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        function toggleAlertasPanel() {
            alertasPanelVisible = !alertasPanelVisible;
            document.getElementById('alertasPanel').style.display = alertasPanelVisible ? 'block' : 'none';
        }
        document.getElementById('alertasBtn').addEventListener('click', toggleAlertasPanel);

        // Conexión SSE
        if (!!window.EventSource) {
            const evtSource = new EventSource('/api/alertas/sse/');
            evtSource.onmessage = function(e) {
                try {
                    // El backend envía un objeto JS como string, lo parseamos
                    let alerta = e.data.replace(/'/g, '"'); // Comillas simples a dobles
                    alerta = JSON.parse(alerta);
                    // Evitar duplicados
                    if (!window.alertas.some(a => a.id === alerta.id)) {
                        window.alertas.unshift(alerta);
                        renderAlertas();
                        showNotification(alerta.mensaje, 'warning');
                    }
                } catch (err) {
                    // Puede ser un array de alertas al inicio
                    try {
                        let alertasArr = JSON.parse(e.data);
                        if (Array.isArray(alertasArr)) {
                            window.alertas = alertasArr;
                            renderAlertas();
                        }
                    } catch (e2) {
                        // Ignorar
                    }
                }
            };
            evtSource.onerror = function(e) {
                showNotification('Error de conexión con el servidor de alertas', 'danger');
            };
        } else {
            showNotification('Tu navegador no soporta notificaciones en tiempo real (SSE)', 'danger');
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
