{% extends 'productos/base.html' %}

{% block content %}
<div class="container">
    <!-- Filtros -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="input-group">
                <span class="input-group-text bg-primary text-white">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar productos...">
            </div>
        </div>
        <div class="col-md-4">
            <select id="sucursalSelect" class="form-select">
                <option value="">Todas las sucursales</option>
            </select>
        </div>
        <div class="col-md-4">
            <select id="ordenarSelect" class="form-select">
                <option value="nombre">Ordenar por nombre</option>
                <option value="precio_asc">Precio: menor a mayor</option>
                <option value="precio_desc">Precio: mayor a menor</option>
                <option value="stock_asc">Stock: menor a mayor</option>
                <option value="stock_desc">Stock: mayor a menor</option>
            </select>
        </div>
    </div>

    <!-- Tabla de inventario -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Categoría</th>
                            <th>Producto</th>
                            <th>Descripción</th>
                            <th>Sucursal</th>
                            <th class="text-end">Precio</th>
                            <th class="text-center">Stock</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventarioTableBody">
                        <!-- El inventario se cargará aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Actualización de Stock -->
<div class="modal fade" id="actualizarStockModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Actualizar Stock</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Producto</label>
                    <p id="productoNombre" class="form-control-plaintext"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sucursal</label>
                    <p id="sucursalNombre" class="form-control-plaintext"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Stock Actual</label>
                    <p id="stockActual" class="form-control-plaintext"></p>
                </div>
                <div class="mb-3">
                    <label for="nuevoStock" class="form-label">Nuevo Stock</label>
                    <input type="number" class="form-control" id="nuevoStock" min="0" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="guardarStock">
                    <i class="fas fa-save me-1"></i>Guardar Cambios
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}

function iniciarAlertasSSE() {
    console.log('⚠️ SSE temporalmente deshabilitado');
    // Cargar alertas estáticas en su lugar
    cargarAlertasEstaticas();
}

function cargarAlertasEstaticas() {
    // Cargar alertas desde la base de datos de forma estática
    fetch('/api/alertas/')
        .then(response => response.json())
        .then(data => {
            alertas = data;
            actualizarPanelAlertas();
            actualizarContadorAlertas();
        })
        .catch(error => {
            console.error('Error al cargar alertas:', error);
        });
}

// Función para recargar alertas periódicamente
function iniciarRecargaPeriodica() {
    // Recargar alertas cada 30 segundos
    setInterval(() => {
        cargarAlertasEstaticas();
    }, 30000);
}

function actualizarPanelAlertas() {
    const panel = document.getElementById('alertasPanel');
    const lista = document.getElementById('alertasLista');
    
    if (alertas.length === 0) {
        panel.style.display = 'none';
        return;
    }
    
    panel.style.display = 'block';
    lista.innerHTML = '';
    
    alertas.forEach(alerta => {
        const item = document.createElement('div');
        item.className = 'alert-item';
        item.innerHTML = `
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                <div class="d-flex align-items-center">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <div class="flex-grow-1">
                        <strong>${alerta.producto}</strong> - ${alerta.sucursal}<br>
                        <small>Stock: ${alerta.stock_actual} (Umbral: ${alerta.umbral})</small>
                    </div>
                    <button type="button" class="btn-close" onclick="marcarAlertaResuelta(${alerta.id})"></button>
                </div>
            </div>
        `;
        lista.appendChild(item);
    });
}

function actualizarContadorAlertas() {
    const contador = document.getElementById('alertasContador');
    const badge = document.getElementById('alertasBadge');
    
    if (alertas.length > 0) {
        badge.textContent = alertas.length;
        badge.style.display = 'inline';
        contador.classList.add('text-warning');
    } else {
        badge.style.display = 'none';
        contador.classList.remove('text-warning');
    }
}

async function marcarAlertaResuelta(alertaId) {
    try {
        const response = await fetch(`/api/alertas/${alertaId}/resuelta/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            }
        });
        
        if (response.ok) {
            // Remover la alerta de la lista local
            alertas = alertas.filter(a => a.id !== alertaId);
            actualizarPanelAlertas();
            actualizarContadorAlertas();
            showNotification('Alerta marcada como resuelta', 'success');
        } else {
            showNotification('Error al marcar alerta como resuelta', 'danger');
        }
    } catch (error) {
        console.error('Error:', error);
        showNotification('Error al marcar alerta como resuelta', 'danger');
    }
}

function toggleAlertasPanel() {
    const panel = document.getElementById('alertasPanel');
    if (panel.style.display === 'none' || panel.style.display === '') {
        panel.style.display = 'block';
    } else {
        panel.style.display = 'none';
    }
}

async function cargarSucursales() {
    try {
        const response = await fetch('/api/sucursales/');
        const data = await response.json();
        sucursales = data;
        
        const select = document.getElementById('sucursalSelect');
        select.innerHTML = '<option value="">Todas las sucursales</option>';
        
        data.forEach(sucursal => {
            const option = document.createElement('option');
            option.value = sucursal.id;
            option.textContent = sucursal.nombre;
            select.appendChild(option);
        });
    } catch (error) {
        console.error('Error al cargar sucursales:', error);
        showNotification('Error al cargar sucursales', 'danger');
    }
}

async function cargarProductos() {
    try {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const sucursalId = document.getElementById('sucursalSelect').value;
        const ordenar = document.getElementById('ordenarSelect').value;
        
        const response = await fetch(`/api/productos/todos_los_productos/`);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        productos = [...data.locales, ...data.sucursales];

        const tableBody = document.getElementById('inventarioTableBody');
        tableBody.innerHTML = '';

        if (productos.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center text-muted">
                        <i class="fas fa-info-circle me-2"></i>
                        No se encontraron productos
                    </td>
                </tr>
            `;
            return;
        }

        productos.forEach(producto => {
            if (producto.nombre.toLowerCase().includes(searchTerm)) {
                if (!sucursalId || sucursalId == producto.sucursal) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${producto.categoria}</td>
                        <td>${producto.nombre}</td>
                        <td>${producto.descripcion}</td>
                        <td>${producto.nombre_sucursal || 'Local'}</td>
                        <td class="text-end">$${Number(producto.precio_base).toLocaleString()}</td>
                        <td class="text-center">
                            <span class="badge ${producto.cantidad > 20 ? 'bg-success' : producto.cantidad > 5 ? 'bg-warning' : 'bg-danger'}">
                                ${producto.cantidad ?? '-'}
                            </span>
                        </td>
                        <td class="text-center">
                            ${producto.es_remoto ? '<span class="text-muted">Remoto</span>' : `
                            <button class="btn btn-sm btn-info" onclick="abrirModalActualizarStock('${producto.nombre}', '${producto.nombre_sucursal}', ${producto.cantidad}, ${producto.id}, ${producto.sucursal})">
                                <i class="fas fa-edit me-1"></i>Actualizar Stock
                            </button>`}
                        </td>
                    `;
                    tableBody.appendChild(tr);
                }
            }
        });
        console.log(productos);

        console.log(`✅ Productos cargados: ${productos.length} total`);

    } catch (error) {
        console.error('❌ Error al cargar productos:', error);
        showNotification('Error al cargar los productos. Verifica que los servidores gRPC estén ejecutándose.', 'danger');
        
        // Mostrar mensaje de error en la tabla
        const tableBody = document.getElementById('inventarioTableBody');
        tableBody.innerHTML = `
            <tr>
                <td colspan="7" class="text-center text-danger">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Error al cargar productos. Verifica la conexión con los servidores.
                </td>
            </tr>
        `;
    }
}

function getColumnIndex(ordenar) {
    switch(ordenar) {
        case 'nombre': return 1;
        case 'precio_asc':
        case 'precio_desc': return 4;
        case 'stock_asc':
        case 'stock_desc': return 5;
        default: return 1;
    }
}

let productoIdActual = null;
let sucursalIdActual = null;

function abrirModalActualizarStock(nombreProducto, nombreSucursal, stockActual, productoId, sucursalId) {
    document.getElementById('productoNombre').textContent = nombreProducto;
    document.getElementById('sucursalNombre').textContent = nombreSucursal;
    document.getElementById('stockActual').textContent = stockActual;
    document.getElementById('nuevoStock').value = stockActual;
    
    productoIdActual = productoId;
    sucursalIdActual = sucursalId;

    const modal = new bootstrap.Modal(document.getElementById('actualizarStockModal'));
    modal.show();
}

async function actualizarStock() {
    const nuevoStock = parseInt(document.getElementById('nuevoStock').value);
    if (isNaN(nuevoStock) || nuevoStock < 0) {
        showNotification('El stock debe ser un número positivo', 'danger');
        return;
    }

    try {
        const response = await fetch(`/api/productos/${productoIdActual}/actualizar_stock/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                stock: nuevoStock
            })
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || 'Error al actualizar el stock');
        }

        const data = await response.json();
        showNotification('Stock actualizado correctamente', 'success');
        
        // Cerrar modal y recargar datos
        const modal = bootstrap.Modal.getInstance(document.getElementById('actualizarStockModal'));
        modal.hide();
        cargarProductos();
    } catch (error) {
        console.error('Error:', error);
        showNotification(error.message || 'Error al actualizar el stock', 'danger');
    }
}

function showNotification(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `toast align-items-center text-white bg-${type} border-0`;
    toast.setAttribute('role', 'alert');
    toast.setAttribute('aria-live', 'assertive');
    toast.setAttribute('aria-atomic', 'true');
    
    toast.innerHTML = `
        <div class="d-flex">
            <div class="toast-body">
                ${message}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    `;
    
    const container = document.querySelector('.toast-container');
    container.appendChild(toast);
    const bsToast = new bootstrap.Toast(toast);
    bsToast.show();
    
    toast.addEventListener('hidden.bs.toast', () => {
        container.removeChild(toast);
    });
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Event Listeners
document.getElementById('searchInput').addEventListener('input', cargarProductos);
document.getElementById('sucursalSelect').addEventListener('change', cargarProductos);
document.getElementById('ordenarSelect').addEventListener('change', cargarProductos);
document.getElementById('guardarStock').addEventListener('click', actualizarStock);
document.getElementById('alertasBtn').addEventListener('click', toggleAlertasPanel);

// Inicialización
document.addEventListener('DOMContentLoaded', () => {
    cargarSucursales();
    cargarProductos();
    iniciarAlertasSSE(); // Ahora carga alertas estáticas
    iniciarRecargaPeriodica(); // Recarga cada 30 segundos
